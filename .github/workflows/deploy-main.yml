name: Deploy to liker.land

on:
  push:
    branches:
      - 'deploy/main'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: main
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - uses: w9jds/setup-firebase@main
        with:
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}
      # Scoped to `hosting` so a deploy can never implicitly add or remove
      # Cloud Functions.
      - run: firebase deploy --only hosting --project civic-liker
