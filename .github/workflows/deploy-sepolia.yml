name: Deploy to sepolia.liker.land

on:
  push:
    branches:
      - 'deploy/sepolia'

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: sepolia
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
      - uses: w9jds/setup-firebase@main
        with:
          firebase_token: ${{ secrets.FIREBASE_TOKEN }}
      # firebase.json hardcodes production 3ook.com destinations, so this
      # environment verifies redirect mechanics (matching, ordering, status
      # codes) rather than testnet destinations.
      - run: firebase deploy --only hosting --project civic-liker-sepolia
